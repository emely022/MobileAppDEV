<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="100%" height="420">
  <rect width="1120" height="420" rx="16" fill="#0f172a"/>
  <text x="560" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SINAV GÖRSEL REHBERİ 1: FOTOĞRAF DİZİLİMLERİ (ALT ALTA · YAN YANA · 2x2 GRID · ETKİLEŞİMLİ)</text>

  <!-- Phone 1: Alt Alta -->
  <g transform="translate(25, 52)">
    <rect width="245" height="345" rx="22" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
    <rect x="72" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="122" y="34" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">1. Alt Alta (W4 Image)</text>
    <text x="122" y="50" text-anchor="middle" fill="#2563eb" font-family="monospace" font-size="10">flexDirection: 'column'</text>
    <!-- Top Rectangular Image -->
    <rect x="22" y="62" width="200" height="105" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="65" cy="95" r="12" fill="#60a5fa"/>
    <polygon points="30,158 95,105 145,145 180,115 215,158" fill="#3b82f6"/>
    <text x="122" y="182" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">borderRadius: 10 (Dikdörtgen)</text>
    <!-- Bottom Circular Image -->
    <circle cx="122" cy="252" r="52" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="122" cy="238" r="16" fill="#f59e0b"/>
    <path d="M92,285 Q122,258 152,285" fill="#f59e0b"/>
    <text x="122" y="322" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">borderRadius: 100 (Yuvarlak)</text>
  </g>

  <!-- Phone 2: Yan Yana -->
  <g transform="translate(295, 52)">
    <rect width="245" height="345" rx="22" fill="#f8fafc" stroke="#22c55e" stroke-width="3"/>
    <rect x="72" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="122" y="34" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">2. Yan Yana Fotoğraflar</text>
    <text x="122" y="50" text-anchor="middle" fill="#16a34a" font-family="monospace" font-size="10">flexDirection: 'row'</text>
    <!-- Row of 2 images -->
    <rect x="18" y="68" width="98" height="98" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="67" y="120" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Foto 1</text>
    <rect x="128" y="68" width="98" height="98" rx="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="177" y="120" text-anchor="middle" fill="#5b21b6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Foto 2</text>
    <text x="67" y="182" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Doğa</text>
    <text x="177" y="182" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Şehir</text>
    <!-- Row of 3 circular avatars -->
    <text x="122" y="212" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">3'lü Yan Yana Yuvarlak:</text>
    <circle cx="52" cy="258" r="30" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
    <text x="52" y="262" text-anchor="middle" fill="#9d174d" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Ayşe</text>
    <circle cx="122" cy="258" r="30" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="122" y="262" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Ali</text>
    <circle cx="192" cy="258" r="30" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="192" y="262" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Zeynep</text>
    <text x="122" y="320" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">justifyContent: 'space-around'</text>
  </g>

  <!-- Phone 3: 2x2 Grid -->
  <g transform="translate(565, 52)">
    <rect width="245" height="345" rx="22" fill="#f8fafc" stroke="#f59e0b" stroke-width="3"/>
    <rect x="72" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="122" y="34" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">3. 2x2 Grid + Üst/Alt</text>
    <text x="122" y="50" text-anchor="middle" fill="#d97706" font-family="monospace" font-size="10">flexWrap: 'wrap' / width: '47%'</text>
    <!-- 2x2 Grid -->
    <rect x="20" y="64" width="96" height="85" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="68" y="110" text-anchor="middle" fill="#991b1b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Resim 1</text>
    <rect x="128" y="64" width="96" height="85" rx="10" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="176" y="110" text-anchor="middle" fill="#9a3412" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Resim 2</text>
    <rect x="20" y="160" width="96" height="85" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <text x="68" y="206" text-anchor="middle" fill="#075985" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Resim 3</text>
    <rect x="128" y="160" width="96" height="85" rx="10" fill="#d9f99d" stroke="#65a30d" stroke-width="2"/>
    <text x="176" y="206" text-anchor="middle" fill="#3f6212" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Resim 4</text>
    <!-- Bottom caption box -->
    <rect x="20" y="260" width="204" height="62" rx="10" fill="#1e293b"/>
    <text x="122" y="284" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Fotoğraf Galerisi</text>
    <text x="122" y="304" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">row + wrap + gap: 12</text>
  </g>

  <!-- Phone 4: W6 Image Playground -->
  <g transform="translate(835, 52)">
    <rect width="255" height="345" rx="22" fill="#0f172a" stroke="#a855f7" stroke-width="3"/>
    <rect x="77" y="8" width="100" height="6" rx="3" fill="#334155"/>
    <text x="127" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="13" font-weight="bold">4. W6 Image Playground</text>
    <text x="127" y="50" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10">resizeMode &amp; blurRadius</text>
    <rect x="20" y="62" width="215" height="125" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
    <text x="127" y="120" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Aktif Görsel</text>
    <text x="127" y="140" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">mode: cover | blur: 0</text>
    <!-- Mode Pills -->
    <rect x="20" y="200" width="62" height="26" rx="13" fill="#38bdf8"/>
    <text x="51" y="217" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="10" font-weight="bold">cover</text>
    <rect x="90" y="200" width="68" height="26" rx="13" fill="#1f2937"/>
    <text x="124" y="217" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10">contain</text>
    <rect x="166" y="200" width="68" height="26" rx="13" fill="#1f2937"/>
    <text x="200" y="217" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10">stretch</text>
    <!-- Action Buttons -->
    <rect x="20" y="242" width="102" height="34" rx="8" fill="#f97316"/>
    <text x="71" y="263" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Blur Aç/Kapat</text>
    <rect x="132" y="242" width="102" height="34" rx="8" fill="#22c55e"/>
    <text x="183" y="263" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Resim Değiştir</text>
    <rect x="20" y="288" width="214" height="34" rx="8" fill="#ef4444"/>
    <text x="127" y="309" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Hata Simüle Et (Fallback)</text>
  </g>
</svg>
