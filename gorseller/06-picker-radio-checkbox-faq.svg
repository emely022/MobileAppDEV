<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="100%" height="430">
  <rect width="1120" height="430" rx="16" fill="#0f172a"/>
  <text x="560" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SINAV GÖRSEL REHBERİ 6: PICKER (AÇILIR MENÜ) · RADIOBUTTON (TEKLİ SEÇİM) · SSS ACCORDION (+/-)</text>

  <!-- Phone 1: W6 Picker + Filtered List -->
  <g transform="translate(25, 52)">
    <rect width="340" height="355" rx="22" fill="#020617" stroke="#f97316" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#334155"/>
    <text x="170" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. W6 Picker + Filtreli Liste</text>
    <text x="170" y="50" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="10">W6 / Picker.md (ScheduleFilter)</text>
    <rect x="22" y="64" width="296" height="46" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="38" y="92" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Foundation Track</text>
    <polygon points="290,82 302,82 296,92" fill="#f97316"/>
    <!-- Filtered Item 1 -->
    <rect x="22" y="128" width="296" height="66" rx="14" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>
    <text x="38" y="156" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Intro to View</text>
    <text x="38" y="178" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Temel seviye</text>
    <!-- Filtered Item 2 -->
    <rect x="22" y="206" width="296" height="66" rx="14" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>
    <text x="38" y="234" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Layout Playground</text>
    <text x="38" y="256" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Temel seviye</text>
    <text x="170" y="318" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">@react-native-picker/picker</text>
  </g>

  <!-- Phone 2: W6 RadioButton -->
  <g transform="translate(390, 52)">
    <rect width="340" height="355" rx="22" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#334155"/>
    <text x="170" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. W6 RadioButton (TrackSelector)</text>
    <text x="170" y="50" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">W6 / RadioButton.md (Pressable)</text>

    <!-- Selected Radio Card -->
    <rect x="22" y="66" width="296" height="54" rx="14" fill="#172554" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="48" cy="93" r="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="48" cy="93" r="5" fill="#38bdf8"/>
    <text x="72" y="98" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Foundation · Layout</text>

    <!-- Unselected Radio Card 1 -->
    <rect x="22" y="132" width="296" height="54" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="48" cy="159" r="10" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="72" y="164" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Growth · Networking</text>

    <!-- Unselected Radio Card 2 -->
    <rect x="22" y="198" width="296" height="54" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="48" cy="225" r="10" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="72" y="230" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Advanced · Performance</text>

    <text x="170" y="300" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Active Module: Foundation · Layout</text>
    <text x="170" y="325" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">isActive ? '#172554' : '#0f172a'</text>
  </g>

  <!-- Phone 3: W6 FAQ Accordion & CourseCard -->
  <g transform="translate(755, 52)">
    <rect width="340" height="355" rx="22" fill="#f8fafc" stroke="#a855f7" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="170" y="34" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. W6 Açılır/Kapanır SSS (FAQItem)</text>
    <text x="170" y="50" text-anchor="middle" fill="#9333ea" font-family="monospace" font-size="10">W6 / TouchableOpacity.md</text>

    <!-- Expanded FAQ Card -->
    <rect x="22" y="68" width="296" height="125" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="36" y="98" fill="#0f172a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">How do I share my project?</text>
    <text x="294" y="100" text-anchor="middle" fill="#2563eb" font-family="Arial, sans-serif" font-size="22" font-weight="bold">−</text>
    <text x="36" y="128" fill="#475569" font-family="Arial, sans-serif" font-size="12">You can either scan the QR code in</text>
    <text x="36" y="146" fill="#475569" font-family="Arial, sans-serif" font-size="12">Expo Go app or publish the project.</text>

    <!-- Collapsed FAQ Card -->
    <rect x="22" y="210" width="296" height="56" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="36" y="243" fill="#0f172a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">What is Fast Refresh?</text>
    <text x="294" y="245" text-anchor="middle" fill="#2563eb" font-family="Arial, sans-serif" font-size="22" font-weight="bold">+</text>

    <text x="170" y="315" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">expanded ? '−' : '+' ve {expanded &amp;&amp; ...}</text>
  </g>
</svg>
