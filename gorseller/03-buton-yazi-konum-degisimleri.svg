<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="100%" height="430">
  <rect width="1120" height="430" rx="16" fill="#0f172a"/>
  <text x="560" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SINAV GÖRSEL REHBERİ 3: BUTON YERİ · BUTON RENGİ/ŞEKLİ · YAZI TİPİ VE KART STİLLERİ</text>

  <!-- Phone 1: Buton Konumları ve Dizilimleri -->
  <g transform="translate(25, 52)">
    <rect width="340" height="355" rx="22" fill="#f8fafc" stroke="#3b82f6" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="170" y="32" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. Butonların Yeri Nasıl Değişir?</text>

    <!-- Yan Yana (row + center) -->
    <text x="24" y="54" fill="#475569" font-family="monospace" font-size="10">flexDirection: 'row', justifyContent: 'center'</text>
    <rect x="65" y="60" width="95" height="32" rx="8" fill="#2563eb"/>
    <text x="112" y="80" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Buton 1</text>
    <rect x="175" y="60" width="95" height="32" rx="8" fill="#16a34a"/>
    <text x="222" y="80" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Buton 2</text>

    <!-- İki Uçta (row + space-between) -->
    <text x="24" y="112" fill="#475569" font-family="monospace" font-size="10">flexDirection: 'row', justifyContent: 'space-between'</text>
    <rect x="24" y="118" width="95" height="32" rx="8" fill="#dc2626"/>
    <text x="71" y="138" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Sol Uç</text>
    <rect x="221" y="118" width="95" height="32" rx="8" fill="#9333ea"/>
    <text x="268" y="138" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Sağ Uç</text>

    <!-- Sola / Ortaya / Sağa Hizalı Tek Buton -->
    <text x="24" y="170" fill="#475569" font-family="monospace" font-size="10">alignSelf: 'flex-start' | 'center' | 'flex-end'</text>
    <rect x="24" y="176" width="85" height="28" rx="6" fill="#0284c7"/>
    <text x="66" y="194" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">flex-start</text>
    <rect x="127" y="208" width="85" height="28" rx="6" fill="#0d9488"/>
    <text x="169" y="226" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">center</text>
    <rect x="231" y="240" width="85" height="28" rx="6" fill="#ea580c"/>
    <text x="273" y="258" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">flex-end</text>

    <!-- Tam Genişlik Alt Buton -->
    <text x="24" y="290" fill="#475569" font-family="monospace" font-size="10">justifyContent: 'space-between' (En Alta İtme)</text>
    <rect x="24" y="298" width="292" height="38" rx="10" fill="#0f172a"/>
    <text x="170" y="322" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Tam Genişlik Alt Buton</text>
  </g>

  <!-- Phone 2: Buton Renkleri ve Şekilleri (W4 Props & State) -->
  <g transform="translate(390, 52)">
    <rect width="340" height="355" rx="22" fill="#f8fafc" stroke="#10b981" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="170" y="32" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. Buton Rengi ve Şekli (W4 &amp; W6)</text>

    <rect x="24" y="48" width="292" height="38" rx="8" fill="#007AFF"/>
    <text x="170" y="72" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Blue Button (#007AFF)</text>

    <rect x="24" y="96" width="292" height="38" rx="8" fill="#28A745"/>
    <text x="170" y="120" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Green Button (#28A745)</text>

    <rect x="24" y="144" width="292" height="38" rx="8" fill="#DC3545"/>
    <text x="170" y="168" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Red Button (#DC3545)</text>

    <rect x="24" y="192" width="292" height="38" rx="8" fill="#cccccc"/>
    <text x="170" y="216" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Disabled Button (disabled={true})</text>

    <!-- Yuvarlak ve Hap Butonlar -->
    <circle cx="75" cy="272" r="26" fill="#007AFF"/>
    <text x="75" y="280" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">-</text>
    <circle cx="145" cy="272" r="26" fill="#007AFF"/>
    <text x="145" y="280" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">+</text>
    <rect x="190" y="252" width="125" height="40" rx="20" fill="#f59e0b"/>
    <text x="252" y="277" text-anchor="middle" fill="#fef3c7" font-family="Arial, sans-serif" font-size="12" font-weight="bold">★ In favorites</text>

    <text x="170" y="330" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">borderRadius: 8 (Köşeli) | 50 (Daire) | 999 (Hap)</text>
  </g>

  <!-- Phone 3: Yazı Tipi & Sol Çizgili Kartlar (W4 Variable & Message) -->
  <g transform="translate(755, 52)">
    <rect width="340" height="355" rx="22" fill="#f8fafc" stroke="#f59e0b" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="170" y="32" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. Yazı Stilleri &amp; Bilgi Kutuları</text>

    <!-- Left-bordered Card 1 (W4 VariableExample / MessageExample) -->
    <rect x="24" y="48" width="292" height="54" rx="8" fill="#f1f5f9"/>
    <rect x="24" y="48" width="5" height="54" rx="2" fill="#007AFF"/>
    <text x="38" y="68" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Welcome (borderLeftWidth: 4)</text>
    <text x="38" y="88" fill="#475569" font-family="Arial, sans-serif" font-size="12">You are learning React Native!</text>

    <!-- Left-bordered Card 2 -->
    <rect x="24" y="112" width="292" height="54" rx="8" fill="#f1f5f9"/>
    <rect x="24" y="112" width="5" height="54" rx="2" fill="#28A745"/>
    <text x="38" y="132" fill="#28A745" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Success (color: '#28A745')</text>
    <text x="38" y="152" fill="#475569" font-family="Arial, sans-serif" font-size="12">You learned props usage!</text>

    <!-- Typography Showcase -->
    <text x="30" y="192" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Kalın Başlık (fontWeight: 'bold')</text>
    <text x="30" y="216" fill="#475569" font-family="Georgia, serif" font-size="14" font-style="italic">İtalik &amp; Serif (fontStyle: 'italic')</text>
    <text x="30" y="240" fill="#007AFF" font-family="Arial, sans-serif" font-size="14" text-decoration="underline">Altı Çizili Link (underline)</text>
    <text x="30" y="264" fill="#dc2626" font-family="Arial, sans-serif" font-size="14" text-decoration="line-through">Üstü Çizili Metin (line-through)</text>
    <text x="30" y="290" fill="#0891b2" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2">BÜYÜK HARF (UPPERCASE)</text>
    <text x="30" y="322" fill="#64748b" font-family="monospace" font-size="11">W4 MessageExample · W4 Text · W6 Text</text>
  </g>
</svg>
