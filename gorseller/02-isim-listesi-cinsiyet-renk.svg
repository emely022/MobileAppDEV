<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="100%" height="430">
  <rect width="1120" height="430" rx="16" fill="#0f172a"/>
  <text x="560" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SINAV GÖRSEL REHBERİ 2: İSİM LİSTESİ + OKEY BUTONU / CHECKBOX / SWITCH İLE CİNSİYETE GÖRE RENK DEĞİŞİMİ</text>

  <!-- Phone 1: İsim + Okey Butonu (Cinsiyete Göre Renk) -->
  <g transform="translate(25, 52)">
    <rect width="340" height="355" rx="22" fill="#f8fafc" stroke="#ec4899" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="170" y="34" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. İsim + Okey Butonu (Cinsiyet Renkli)</text>
    <text x="170" y="50" text-anchor="middle" fill="#db2777" font-family="monospace" font-size="10">Kadın=Pembe (#fce7f3) | Erkek=Mavi (#dbeafe)</text>

    <!-- Row 1: Ayşe (Kadın - Okey Verilmiş -> Pembe) -->
    <rect x="18" y="64" width="304" height="54" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="32" y="88" fill="#9d174d" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Ayşe Yılmaz</text>
    <text x="32" y="106" fill="#be185d" font-family="Arial, sans-serif" font-size="11">Cinsiyet: Kadın · Onaylandı</text>
    <rect x="234" y="74" width="76" height="34" rx="8" fill="#ec4899"/>
    <text x="272" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Okey ✓</text>

    <!-- Row 2: Ahmet (Erkek - Okey Verilmiş -> Mavi) -->
    <rect x="18" y="128" width="304" height="54" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="32" y="152" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Ahmet Demir</text>
    <text x="32" y="170" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11">Cinsiyet: Erkek · Onaylandı</text>
    <rect x="234" y="138" width="76" height="34" rx="8" fill="#2563eb"/>
    <text x="272" y="159" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Okey ✓</text>

    <!-- Row 3: Zeynep (Kadın - Henüz Okey Verilmemiş -> Beyaz/Gri) -->
    <rect x="18" y="192" width="304" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="216" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Zeynep Kaya</text>
    <text x="32" y="234" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Cinsiyet: Kadın · Bekliyor</text>
    <rect x="234" y="202" width="76" height="34" rx="8" fill="#64748b"/>
    <text x="272" y="223" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Okey Ver</text>

    <!-- Row 4: Mehmet (Erkek - Henüz Okey Verilmemiş -> Beyaz/Gri) -->
    <rect x="18" y="256" width="304" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="32" y="280" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Mehmet Çelik</text>
    <text x="32" y="298" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Cinsiyet: Erkek · Bekliyor</text>
    <rect x="234" y="266" width="76" height="34" rx="8" fill="#64748b"/>
    <text x="272" y="287" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Okey Ver</text>

    <text x="170" y="335" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Onaylanan: 2 / 4 (Kadın: 1, Erkek: 1)</text>
  </g>

  <!-- Phone 2: W6 FlatList + Switch / Checkbox -->
  <g transform="translate(390, 52)">
    <rect width="340" height="355" rx="22" fill="#f8fafc" stroke="#22c55e" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <text x="170" y="34" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. W6 FlatList + Switch (CourseModules)</text>
    <text x="170" y="50" text-anchor="middle" fill="#16a34a" font-family="monospace" font-size="10">done ? '#dcfce7' : '#fff'</text>

    <!-- Module 1: Done -->
    <rect x="18" y="66" width="304" height="58" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="32" y="92" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Introduction &amp; Setup</text>
    <text x="32" y="110" fill="#475569" font-family="Arial, sans-serif" font-size="11">Duration: 12 min</text>
    <rect x="258" y="82" width="46" height="26" rx="13" fill="#22c55e"/>
    <circle cx="291" cy="95" r="10" fill="#ffffff"/>

    <!-- Module 2: Done -->
    <rect x="18" y="136" width="304" height="58" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="32" y="162" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Core Components</text>
    <text x="32" y="180" fill="#475569" font-family="Arial, sans-serif" font-size="11">Duration: 18 min</text>
    <rect x="258" y="152" width="46" height="26" rx="13" fill="#22c55e"/>
    <circle cx="291" cy="165" r="10" fill="#ffffff"/>

    <!-- Module 3: Not Done -->
    <rect x="18" y="206" width="304" height="58" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="32" y="232" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">State &amp; Props</text>
    <text x="32" y="250" fill="#475569" font-family="Arial, sans-serif" font-size="11">Duration: 22 min</text>
    <rect x="258" y="222" width="46" height="26" rx="13" fill="#cbd5e1"/>
    <circle cx="271" cy="235" r="10" fill="#ffffff"/>

    <text x="170" y="305" text-anchor="middle" fill="#1f2937" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Completed: 2 / 3</text>
    <text x="170" y="330" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">ListFooterComponent ile otomatik sayaç</text>
  </g>

  <!-- Phone 3: W6 Checkbox + Cinsiyet/Görev Seçimi -->
  <g transform="translate(755, 52)">
    <rect width="340" height="355" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="120" y="8" width="100" height="6" rx="3" fill="#334155"/>
    <text x="170" y="34" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. W6 Checkbox + Üstü Çizili / Renkli</text>
    <text x="170" y="50" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">textDecorationLine: 'line-through'</text>

    <!-- Item 1 Checked Female -->
    <rect x="20" y="68" width="300" height="48" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="34" y="81" width="22" height="22" rx="6" fill="#ec4899"/>
    <text x="45" y="97" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="70" y="97" fill="#f472b6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-decoration="line-through">Selin Aksoy (Kadın)</text>

    <!-- Item 2 Checked Male -->
    <rect x="20" y="128" width="300" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="34" y="141" width="22" height="22" rx="6" fill="#38bdf8"/>
    <text x="45" y="157" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">✓</text>
    <text x="70" y="157" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-decoration="line-through">Burak Yılmaz (Erkek)</text>

    <!-- Item 3 Unchecked -->
    <rect x="20" y="188" width="300" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="34" y="201" width="22" height="22" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="70" y="217" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Elif Demir (Kadın)</text>

    <!-- Save Button -->
    <rect x="20" y="265" width="300" height="46" rx="14" fill="#38bdf8"/>
    <text x="170" y="293" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Seçimleri Kaydet (Aktif)</text>
    <text x="170" y="335" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">W6 Checkbox.md (LessonChecklist)</text>
  </g>
</svg>
